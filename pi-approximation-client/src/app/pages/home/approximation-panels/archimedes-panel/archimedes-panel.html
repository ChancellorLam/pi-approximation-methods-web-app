<h2 class="panel-title">Archimedes' Method</h2>
<div class="panel">
  <div class="archimedes-visualization">
    <svg viewBox="0 0 600 600">

      <!-- Inscribed Polygon -->
      <polygon
        class="inscribed-polygon-perimeter"
        [attr.points]="getPolygonPoints(numSides(), radius)"
      />

      <circle
        class="circle-perimeter"
        [attr.cx]="center"
        [attr.cy]="center"
        [attr.r]="radius"
      />

      <!-- Circumscribed Polygon -->
      <polygon
        class="circumscribed-polygon-perimeter"
        [attr.points]="getPolygonPoints(numSides(), radius / Math.cos(Math.PI / numSides()))"
      />

    </svg>
  </div>


  <app-panel-controls
    [minSliderValue]="0"
    [maxSliderValue]="11"
    [stepSize]="1"
    [intervalMs]="1000"
    [playLoop]="true"
    [label]="numSides()"
    (valueChange)="onSidesChange($event)"
  ></app-panel-controls>

  <div class="archimedes-pi-approximation">
      <span class="archimedes-pi-lower-bound">
        <span class="matching-digits">{{ matchingDigitsClassification().matchingLowerDigits }}</span
        >{{ matchingDigitsClassification().nonMatchingLowerDigits }}
      </span>

      <span class="archimedes-pi-center">&lt; &pi; &lt;</span>

    <span class="archimedes-pi-upper-bound">
      <span class="matching-digits">{{ matchingDigitsClassification().matchingUpperDigits }}</span
      >{{ matchingDigitsClassification().nonMatchingUpperDigits }}
    </span>
  </div>
</div>
