<h2 class="panel-title">Madhava-Leibniz Series</h2>
<div class="panel">
  <div #madhavaLeibnizSeriesMathDisplay class="madhava-leibniz-visualization"></div>

  <app-panel-controls
    [minSliderValue]="0"
    [maxSliderValue]="maxSliderValue"
    [stepSize]="stepSize"
    [intervalMs]="24"
    (valueChange)="onTermsChange($event)"
  ></app-panel-controls>


  <div class="madhava-leibniz-pi-approximation">
    <span>&pi; =&nbsp;</span>
    <span class="matching-digits">{{ correctPiDigits().matchingDigits }}</span>
    {{ correctPiDigits().nonMatchingDigits }}
  </div>
</div>
